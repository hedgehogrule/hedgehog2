<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的全自動夢幻行事曆</title>
    <style>
        :root {
            --sat-color: #5b9bd5; 
            --sun-color: #ed7d31; 
            --dreamy-bg: linear-gradient(135deg, #ffe0f0 0%, #e0f7fa 50%, #e6d9ff 100%);
            --cycle-border-color: #a28cdb; /* 週期粗框顏色 */
        }
        
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0 0 10px 0; background: var(--dreamy-bg); background-attachment: fixed; min-height: 100vh; user-select: none; color: #444; }
        
        /* Header 調整 */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(5px); border-bottom: 1px solid rgba(255,255,255,0.3); margin-bottom: 5px; }
        .header button { background: none; border: none; font-size: 18px; color: #777; cursor: pointer; padding: 5px; }
        .header-center-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .header-center { display: flex; align-items: center; gap: 8px; }
        .header h2 { margin: 0; font-size: 18px; font-weight: bold; color: #555; }
        .today-btn { font-size: 12px !important; background: #fff !important; color: #ff6b81 !important; border: 1.5px solid #ff6b81 !important; border-radius: 6px !important; padding: 2px 6px !important; font-weight: bold; }
        
        .header-stats { display: flex; gap: 6px; }
        .stat-box { background: #fff; border: 1px solid #dcd0ff; border-radius: 6px; padding: 2px 8px; font-size: 10px; font-weight: bold; color: #7a6baf; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .stat-box span { font-size: 13px; color: #444; }
        
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: rgba(255, 255, 255, 0.6); border-radius: 8px; margin: 0 4px 4px 4px; color: #666; text-align: center; font-size: 11px; font-weight: bold; }
        .weekdays div { padding: 4px 0; }
        .weekdays div:nth-child(6) { color: #5b9bd5; } 
        .weekdays div:nth-child(7) { color: #ed7d31; } 
        
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 0 4px; }
        
        /* 方格基礎樣式 - 移除底色交替，改為透明底 */
        .day { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(2px); min-height: 75px; padding: 2px; display: flex; flex-direction: column; cursor: pointer; border-radius: 4px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.05); }
        
        /* 週期表現方式：改為粗方框區別 */
        .day.cycle-even { border: 2px solid var(--cycle-border-color) !important; background: rgba(255, 255, 255, 0.7); }
        .day.cycle-odd { border: 1px solid rgba(0,0,0,0.1) !important; }
        
        /* 今日高亮 */
        .day.today-highlight { background: #fff5f6 !important; border: 2.5px solid #ff4757 !important; box-shadow: 0 0 8px rgba(255,71,87,0.3) !important; z-index: 1; }
        .day.empty { background: transparent; border: none !important; }

        /* 關鍵：強制單行排列日期與班別 */
        .day-header { display: flex; justify-content: flex-start; align-items: center; gap: 2px; width: 100%; height: 18px; overflow: hidden; white-space: nowrap; }
        
        .date-box { font-size: 11px; font-weight: bold; color: #666; display: flex; align-items: center; flex-shrink: 0; min-width: 14px; }
        .sat-text { color: #4183c4; }
        .sun-text { color: #d9534f; }
        
        /* 號碼班：改為微型圓圈 */
        .badge-container { display: inline-flex; align-items: center; margin-left: 1px; flex-shrink: 0; }
        .week-badge { width: 13px; height: 13px; background: #7a6baf; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; transform: scale(0.9); }

        /* 班別膠囊：優化為緊湊型 */
        .shift-badge-wrap { display: flex; gap: 1px; align-items: center; overflow: hidden; }
        .shift-badge { font-size: 9px; font-weight: bold; padding: 1px 3px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; height: 14px; line-height: 12px; }
        .shift-off { background: #b6a4e3; color: white; }
        .shift-d { background: #ffffff; color: #444444; border: 0.5px solid #ccc; }
        .shift-green { background: #5ece9d; color: white; }
        .shift-default { background: #e9ecef; color: #555; }
        .shift-num-tag { font-size: 9px; color: #d9534f; font-weight: bold; padding: 0 1px; } /* 加減時數樣式 */

        /* 行程區域 */
        .event-area { margin-top: auto; display: flex; flex-direction: column; gap: 1px; width: 100%; }
        .event-item { font-size: 9px; padding: 1px 3px; box-sizing: border-box; white-space: nowrap; height: 14px; line-height: 12px; border-radius: 2px; }
        .event-item-title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; }

        /* Modal 樣式保持原樣但縮小間距 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 10; }
        .modal-content { background: #fff; padding: 15px; width: 92%; max-width: 400px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .input-group { margin-bottom: 10px; }
        .shift-input-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .shift-action-btn { padding: 6px 4px; font-size: 11px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; }
        .circle-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: white; font-weight: bold; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="changeMonth(-1)">&#10094;</button>
        <div class="header-center-wrap">
            <div class="header-center">
                <h2 id="monthYear"></h2>
                <button class="today-btn" onclick="goToday()">今天</button>
            </div>
            <div class="header-stats">
                <div class="stat-box" onclick="openStatsModal('hours')">時數 <span id="hdrHours">0</span></div>
                <div class="stat-box" onclick="openStatsModal('annualLeave')">年休 <span id="hdrAL">0</span></div>
            </div>
        </div>
        <button onclick="changeMonth(1)">&#10095;</button>
    </div>

    <div class="weekdays">
        <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <div id="modalSubtitle" style="text-align:center; font-size:11px; color:#888; margin-bottom:10px;"></div>
            
            <div class="input-group">
                <label id="shiftLabel" style="font-size:12px; font-weight:bold;">班別</label>
                <div class="shift-input-row">
                    <input type="text" id="shiftInput" placeholder="請點選快捷鍵" style="flex: 1; padding:8px; border-radius:6px; border:1px solid #ddd;">
                    <button class="shift-action-btn" style="color:#d9534f" onclick="handleQuickStat('加班')">加班</button>
                    <button class="shift-action-btn" style="color:#5b9bd5" onclick="handleQuickStat('拿時間')">拿時間</button>
                    <button class="shift-action-btn" style="color:#5ece9d" onclick="handleQuickStat('年休')">年休</button>
                    <button class="circle-btn" style="background:#ff9ebb" onclick="toggleTag('例休')">例休</button>
                    <button class="circle-btn" style="background:#ffa67c" onclick="toggleTag('國假')">國假</button>
                </div>
                
                <div style="margin-top:10px; display:grid; grid-template-columns: repeat(5, 1fr); gap:4px;">
                    <button onclick="setShift('D')" style="font-size:11px; padding:5px;">D</button>
                    <button onclick="setShift('D1')" style="font-size:11px; padding:5px;">D1</button>
                    <button onclick="setShift('D2')" style="font-size:11px; padding:5px;">D2</button>
                    <button onclick="setShift('E1')" style="font-size:11px; padding:5px; background:#eafaf1;">E1</button>
                    <button onclick="setShift('N1')" style="font-size:11px; padding:5px; background:#eafaf1;">N1</button>
                    <button onclick="setShift('12-8 1')" style="font-size:11px; padding:5px; background:#eafaf1;">12-8 1</button>
                    <button onclick="setShift('12-8 2')" style="font-size:11px; padding:5px; background:#eafaf1;">12-8 2</button>
                    <button onclick="setShift('OFF')" style="font-size:11px; padding:5px; background:#f3eefd;">OFF</button>
                </div>
                <div style="font-size:10px; color:#999; margin-top:5px;">(點擊班別即可填入)</div>
            </div>
            
            <div class="event-list-container">
                <div id="existingEventsList" class="existing-events"></div>
                <button class="btn-add" style="width:100%; border:1px dashed #a28cdb; padding:8px; border-radius:6px; color:#a28cdb; background:none;" onclick="openEventDetailModal()">+ 新增獨立行程</button>
            </div>

            <div style="display:flex; gap:8px; margin-top:15px;">
                <button onclick="closeModal()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#eee;">取消</button>
                <button onclick="saveShiftOnly()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#a28cdb; color:white; font-weight:bold;">儲存</button>
            </div>
        </div>
    </div>

    <div class="modal" id="statsModal"> <div class="modal-content"><h3 id="statsModalTitle"></h3><div id="statsModalBalance"></div><div id="statsList"></div><button onclick="closeStatsModal()">關閉</button></div> </div>
    <div class="modal" id="eventDetailModal"> <div class="modal-content"><h3>行程設定</h3><input type="text" id="eventTitle" placeholder="行程名稱"><input type="date" id="eventStartDate"><input type="date" id="eventEndDate"><button onclick="saveEventDetail()">儲存</button><button onclick="closeEventDetailModal()">取消</button></div> </div>

    <script>
        // 34 週班表資料庫
        const shiftPatterns = [
            ["D9", "D", "D5", "D5", "D7", "OFF", "N2"], ["N1", "N2", "OFF", "OFF", "N2", "N1", "OFF"],
            ["E3", "E3", "E3", "E3", "E3", "OFF", "E1"], ["E4", "E4", "E4", "E4", "E4", "OFF", "OFF"],
            ["D10", "D8", "D2", "D", "D4", "D1", "OFF"], ["E1", "E1", "E1", "E1", "E1", "OFF", "N1"],
            ["N2", "N1", "N1", "N2", "OFF", "OFF", "OFF"], ["D4", "D6", "D", "D10", "D3", "OFF", "OFF"],
            ["E2", "E2", "E2", "E2", "E2", "E2", "OFF"], ["D5", "D", "D6", "D2", "DB1", "D2", "OFF"],
            ["DB1", "D7", "D1", "D8", "D5", "OFF", "OFF"], ["D3", "DB1", "N2", "N1", "N1", "N2", "OFF"],
            ["OFF", "D10", "D3", "D7", "D1", "OFF", "OFF"], ["12-8 1", "12-8 2", "12-8 3", "12-8 4", "12-8 5", "OFF", "E2"],
            ["12-8 2", "12-8 3", "12-8 4", "12-8 5", "12-8 1", "OFF", "OFF"], ["D7", "D4", "D9", "DB1", "D2", "OFF", "D2"],
            ["D", "D3", "D10", "D1", "D9", "OFF", "OFF"], ["12-8 3", "12-8 4", "12-8 5", "12-8 1", "12-8 2", "E1", "OFF"],
            ["12-8 4", "12-8 5", "12-8 1", "12-8 2", "12-8 3", "OFF", "OFF"], ["D1", "D9", "D4", "D9", "D6", "9-5訪", "OFF"],
            ["D2", "D5", "DB1", "D6", "D8", "OFF", "D1"], ["D", "D", "D", "D", "D", "OFF", "OFF"],
            ["OFF", "OFF", "OFF", "OFF", "OFF", "OFF", "OFF"], ["D'OFF", "D", "D", "D", "D", "OFF", "OFF"],
            ["12-8 5", "12-8 1", "12-8 2", "12-8 3", "12-8 4", "OFF", "OFF"], ["D8", "D2", "D7", "D4", "D", "OFF.B", "OFF"],
            ["D6", "D1", "D8", "D3", "D10", "D3", "OFF"], ["D", "D", "D", "D", "D", "OFF", "OFF"],
            ["D11", "D11", "D11", "D11", "D11", "OFF", "9-5訪"], ["D", "D", "D", "D", "D", "OFF", "OFF"],
            ["D12", "D12", "D12", "D12", "D12", "OFF", "OFF"], ["D", "D", "D", "D", "D", "OFF", "OFF"],
            ["D", "D", "D", "D", "D", "D4", "OFF"], ["D13", "D13", "D13", "D13", "D13", "OFF", "OFF"]
        ];

        const colorStyles = {
            blue: { bg: 'rgba(91, 155, 213, 0.2)', text: '#3e6e96', border: '#84bde3' },
            pink: { bg: 'rgba(255, 158, 187, 0.25)', text: '#a83b5c', border: '#ff9ebb' },
            green: { bg: 'rgba(127, 217, 178, 0.25)', text: '#23704d', border: '#7fd9b2' },
            purple: { bg: 'rgba(195, 179, 239, 0.25)', text: '#5c439c', border: '#c3b3ef' },
            yellow: { bg: 'rgba(252, 211, 114, 0.3)', text: '#704f02', border: '#fcd372' },
            orange: { bg: 'rgba(255, 166, 124, 0.25)', text: '#a13b08', border: '#ffa67c' }
        };

        let currentDate = new Date();
        let selectedDateString = "";
        let calendarData = JSON.parse(localStorage.getItem('myCustomCalendar3')) || {}; 
        let globalStats = JSON.parse(localStorage.getItem('myCustomCalendarStats')) || { hours: [], annualLeave: [] };

        function parseDateLocal(dateStr) { let p = dateStr.split('-'); return new Date(p[0], p[1]-1, p[2]); }
        function formatDateLocal(d) { return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`; }

        function getAutoShift(y, m, d) {
            let target = new Date(y, m, d);
            let dayW = target.getDay();
            let diff = dayW === 0 ? -6 : 1 - dayW;
            let targetMon = new Date(y, m, d + diff);
            let ref = new Date(2026, 6, 6); 
            let weeksDiff = Math.floor(Math.round((targetMon - ref) / 864e5) / 7);
            let idx = (13 + weeksDiff) % 34;
            if (idx < 0) idx += 34;
            return { shift: shiftPatterns[idx][dayW === 0 ? 6 : dayW - 1], weekNumber: idx + 1 };
        }

        function getCycleInfo(y, m, d) {
            let target = new Date(y, m, d, 12);
            let ref = new Date(2026, 5, 8, 12); 
            let days = Math.floor((target - ref) / 864e5);
            let cycleIdx = Math.floor(days / 28);
            return { isEven: Math.abs(cycleIdx) % 2 === 0 };
        }

        // 修改：多重標籤優化，解決 12-8 空格問題
        function generateShiftBadges(finalShift) {
            if (!finalShift) return "";
            let html = '<div class="shift-badge-wrap">';
            // 邏輯改進：先尋找特定完整的詞彙(12-8 X)，再處理其他的
            let text = finalShift.trim();
            let tokens = [];
            
            // 抓取 12-8 格式
            let m128 = text.match(/12-8\s\d+/g);
            if(m128) {
                m128.forEach(m => { tokens.push(m); text = text.replace(m, ''); });
            }
            // 抓取剩餘單詞
            text.split(/\s+/).filter(Boolean).forEach(t => tokens.push(t));

            tokens.forEach(p => {
                let s = p.toUpperCase();
                if (s === "例休") html += `<div class="shift-badge" style="background:#ff9ebb; color:white;">${p}</div>`;
                else if (s === "國假") html += `<div class="shift-badge" style="background:#ffa67c; color:white;">${p}</div>`;
                else if (s.includes("OFF")) html += `<div class="shift-badge shift-off">${p}</div>`;
                else if (s.match(/^[+-]\d+(\.\d+)?$/) || s.startsWith("年休-")) {
                    html += `<div class="shift-num-tag">${p}</div>`;
                } else if (s.startsWith("D")) html += `<div class="shift-badge shift-d">${p}</div>`;
                else if (s.startsWith("12") || s.startsWith("E") || s.startsWith("N")) html += `<div class="shift-badge shift-green">${p}</div>`;
                else html += `<div class="shift-badge shift-default">${p}</div>`;
            });
            html += '</div>';
            return html;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('monthYear').innerText = `${year}年 ${month + 1}月`;
            const hBal = globalStats.hours.reduce((s, i) => s + i.amount, 0);
            const aBal = globalStats.annualLeave.reduce((s, i) => s + i.amount, 0);
            document.getElementById('hdrHours').innerText = hBal;
            document.getElementById('hdrAL').innerText = aBal;

            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = "";
            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1;
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const realToday = new Date();
            const isThisMonth = (realToday.getFullYear() === year && realToday.getMonth() === month);

            for (let i = 0; i < firstDay; i++) calendarEl.innerHTML += `<div class="day empty"></div>`;

            for (let i = 1; i <= daysInMonth; i++) {
                const dateKey = `${year}-${(month + 1).toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
                const dayW = new Date(year, month, i).getDay();
                const savedData = calendarData[dateKey] || {};
                const autoInfo = getAutoShift(year, month, i);
                const cycleInfo = getCycleInfo(year, month, i);
                
                let finalShift = savedData.shift !== undefined ? savedData.shift : autoInfo.shift;
                let shiftHtml = generateShiftBadges(finalShift);
                let dateColorClass = (dayW === 0) ? "sun-text" : (dayW === 6 ? "sat-text" : "");

                // 號碼班圈圈
                let badgeHtml = (dayW === 1) ? `<div class="badge-container"><div class="week-badge">${autoInfo.weekNumber}</div></div>` : "";
                
                // 行程標籤 (精簡版)
                let eventsHtml = "";
                // 此處簡化行程渲染邏輯，實際應用可由 getExpandedEvents 取得
                
                let cycleClass = cycleInfo.isEven ? "cycle-even" : "cycle-odd";
                let todayClass = (isThisMonth && i === realToday.getDate()) ? "today-highlight" : "";

                calendarEl.innerHTML += `
                    <div class="day ${cycleClass} ${todayClass}" onclick="openModal('${dateKey}', '${year}年${month+1}月${i}日')">
                        <div class="day-header">
                            <div class="date-box ${dateColorClass}">${i}${badgeHtml}</div>
                            ${shiftHtml}
                        </div>
                        <div class="event-area">${eventsHtml}</div>
                    </div>
                `;
            }
        }

        // --- 核心功能函數 ---
        function goToday() { currentDate = new Date(); renderCalendar(); }
        function changeMonth(s) { currentDate.setDate(1); currentDate.setMonth(currentDate.getMonth()+s); renderCalendar(); }
        function openModal(k, d) { 
            selectedDateString = k; 
            document.getElementById('modalTitle').innerText = d;
            let saved = calendarData[k] || {};
            document.getElementById('shiftInput').value = saved.shift || getAutoShift(currentDate.getFullYear(), currentDate.getMonth(), parseInt(k.split('-')[2])).shift;
            document.getElementById('editModal').style.display='flex'; 
        }
        function closeModal() { document.getElementById('editModal').style.display='none'; }
        function setShift(v) { document.getElementById('shiftInput').value = v; }
        function toggleTag(t) {
            let input = document.getElementById('shiftInput');
            let parts = input.value.split(/\s+/).filter(Boolean);
            if(parts.includes(t)) parts = parts.filter(p => p !== t);
            else parts.push(t);
            input.value = parts.join(' ');
        }
        function handleQuickStat(act) {
            let val = prompt(`請輸入 ${act} 數量:`);
            if(!val) return;
            let num = parseFloat(val);
            let type = (act === '年休') ? 'annualLeave' : 'hours';
            let sign = (act === '加班') ? 1 : -1;
            globalStats[type].push({ id: Date.now(), date: selectedDateString, amount: Math.abs(num)*sign, desc: act });
            localStorage.setItem('myCustomCalendarStats', JSON.stringify(globalStats));
            let input = document.getElementById('shiftInput');
            input.value += ` ${act==='年休'?'年休':''}${sign>0?'+':'-'}${Math.abs(num)}`;
            updateStatsDisplay();
        }
        function saveShiftOnly() {
            if(!calendarData[selectedDateString]) calendarData[selectedDateString] = {};
            calendarData[selectedDateString].shift = document.getElementById('shiftInput').value.trim();
            localStorage.setItem('myCustomCalendar3', JSON.stringify(calendarData));
            closeModal(); renderCalendar();
        }
        function updateStatsDisplay() {
            document.getElementById('hdrHours').innerText = globalStats.hours.reduce((s, i) => s + i.amount, 0);
            document.getElementById('hdrAL').innerText = globalStats.annualLeave.reduce((s, i) => s + i.amount, 0);
        }

        renderCalendar();
    </script>
</body>
</html>
