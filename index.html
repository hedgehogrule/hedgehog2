<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的行事曆</title>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; padding: 10px; }
        .header { display: flex; justify-content: space-between; padding: 10px; background: white; margin-bottom: 5px; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #ccc; border: 1px solid #ccc; }
        .day { background: white; min-height: 80px; padding: 5px; cursor: pointer; }
        .shift { font-size: 12px; font-weight: bold; background: #eee; padding: 2px; border-radius: 4px; margin-top: 5px; text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 80%; }
    </style>
</head>
<body>
    <div class="header">
        <button onclick="changeMonth(-1)">上月</button>
        <h2 id="monthTitle"></h2>
        <button onclick="changeMonth(1)">下月</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalDate"></h3>
            <input type="text" id="shiftInput" placeholder="輸入班別">
            <input type="text" id="noteInput" placeholder="備註(與誰換班)">
            <button onclick="save()">儲存</button>
            <button onclick="document.getElementById('modal').style.display='none'">取消</button>
        </div>
    </div>
    <script>
        let curDate = new Date();
        let data = JSON.parse(localStorage.getItem('calData')) || {};
        function render() {
            const m = curDate.getMonth(), y = curDate.getFullYear();
            document.getElementById('monthTitle').innerText = `${y}年 ${m+1}月`;
            const el = document.getElementById('calendar'); el.innerHTML = "";
            const days = new Date(y, m+1, 0).getDate();
            for(let i=1; i<=days; i++) {
                const key = `${y}-${m+1}-${i}`, val = data[key] || {};
                el.innerHTML += `<div class="day" onclick="openModal('${key}')">
                    <div>${i}</div>
                    <div class="shift">${val.shift || '未設'}</div>
                    <div style="font-size:10px">${val.note || ''}</div>
                </div>`;
            }
        }
        function openModal(key) {
            document.getElementById('modalDate').innerText = key;
            document.getElementById('shiftInput').value = data[key]?.shift || '';
            document.getElementById('noteInput').value = data[key]?.note || '';
            document.getElementById('modal').style.display = 'flex';
        }
        function save() {
            const key = document.getElementById('modalDate').innerText;
            data[key] = { shift: document.getElementById('shiftInput').value, note: document.getElementById('noteInput').value };
            localStorage.setItem('calData', JSON.stringify(data));
            document.getElementById('modal').style.display = 'none';
            render();
        }
        render();
    </script>
</body>
</html>
