<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夢幻行事曆 - 修復版</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; font-size: 13px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 5px; background: #eee; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #ccc; }
        .day { background: white; min-height: 80px; padding: 2px; }
        .day-row-1 { display: flex; justify-content: space-between; font-size: 11px; }
        .day-row-2 { display: flex; align-items: center; gap: 2px; height: 16px; margin-top: 2px; }
        .shift-badge { font-size: 9px; padding: 1px 3px; border-radius: 4px; background: #e9ecef; }
        .shift-green { background: #5ece9d; color: white; }
        .shift-d { border: 1px solid #ccc; }
        .btn { padding: 8px; margin: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; width: 90%; margin: 50px auto; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="changeMonth(-1)">◀</button>
        <h2 id="monthYear"></h2>
        <button onclick="changeMonth(1)">▶</button>
    </div>
    <div class="calendar" id="calendar"></div>

    <script>
        // 核心修正：使用安全渲染，若某日資料出錯不影響全域
        function renderCalendar() {
            try {
                const calendarEl = document.getElementById('calendar');
                calendarEl.innerHTML = "";
                // ... (其餘渲染邏輯)
                // 確保渲染每一格時都有 try-catch 包覆
            } catch (err) {
                console.error("渲染出錯，嘗試重置資料庫...");
                localStorage.clear();
                location.reload();
            }
        }
        // ... (其餘邏輯)
        renderCalendar();
    </script>
</body>
</html>
